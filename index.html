<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Caderneta</title>
<style>
/* Layout: caderneta de campo. Uma coluna, abas fixas embaixo, detalhes e formulários sobem como folhas.
   Cor: verde de pasto como acento único; amarelo de brinco só nas etiquetas dos animais. */
:root{
  --bg:#EEF1EA;
  --surface:#F9FAF6;
  --ink:#16231A;
  --muted:#586A5D;
  --line:#D3DACD;
  --accent:#2C6B3F;
  --on-accent:#F6FAF4;
  --accent-soft:#DCEADC;
  --warn:#8F5600;
  --warn-soft:#F6E6C6;
  --danger:#B3261E;
  --danger-soft:#F7DAD6;
  --tag:#F2C230;
  --tag-ink:#2B2300;
  --c-an:#4F7CAC;--c-1:#4F7CAC;--c-2:#C98A1B;--c-3:#4E8F57;--c-4:#B5533C;--c-5:#7A5FA8;--c-6:#5F8F95;--c-7:#8C8C80;
  --sky1:#86C4EA;--sky2:#EAF4E4;--sun:#FFD768;--cloud:#FFFFFF;
  --hill3:#A6CE98;--hill2:#85B777;--hill1:#63A058;
  --tree:#3E7B46;--trunk:#6E4B2E;--cow:#F3F0E8;--cowline:#8F887C;
  --trough:#8A5A34;--feed:#E3B64F;--fence:#8B6B48;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1511;--surface:#161E19;--ink:#E4ECE3;--muted:#9AAA9E;--line:#27342B;
    --accent:#6DBF86;--on-accent:#0B1A10;--accent-soft:#1D3325;
    --warn:#E5A648;--warn-soft:#3A2D12;--danger:#F28B82;--danger-soft:#3C1B18;
    --c-an:#8FB3DE;--c-1:#8FB3DE;--c-2:#E3B04B;--c-3:#7FC08A;--c-4:#E58B73;--c-5:#B79CDF;--c-6:#8FC2C8;--c-7:#A8A89A;--sky1:#1B2347;--sky2:#C9774F;--sun:#F6C26B;--cloud:#7A5C7E;--hill3:#27402F;--hill2:#1C3324;--hill1:#14271B;--tree:#1E3A27;--trunk:#3B2A1C;--cow:#B9B3A7;--cowline:#6D685F;--trough:#5A3A22;--feed:#B8923F;--fence:#5B4733;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1511;--surface:#161E19;--ink:#E4ECE3;--muted:#9AAA9E;--line:#27342B;
  --accent:#6DBF86;--on-accent:#0B1A10;--accent-soft:#1D3325;
  --warn:#E5A648;--warn-soft:#3A2D12;--danger:#F28B82;--danger-soft:#3C1B18;
    --c-an:#8FB3DE;--c-1:#8FB3DE;--c-2:#E3B04B;--c-3:#7FC08A;--c-4:#E58B73;--c-5:#B79CDF;--c-6:#8FC2C8;--c-7:#A8A89A;--sky1:#1B2347;--sky2:#C9774F;--sun:#F6C26B;--cloud:#7A5C7E;--hill3:#27402F;--hill2:#1C3324;--hill1:#14271B;--tree:#1E3A27;--trunk:#3B2A1C;--cow:#B9B3A7;--cowline:#6D685F;--trough:#5A3A22;--feed:#B8923F;--fence:#5B4733;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 var(--font-body);
  padding-block:12px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body.sheet-open{overflow:hidden}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabeçalho */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 4px}
.brand{min-width:0}
.brand h1{font:700 30px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.brand p{margin-top:4px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* Botões e campos */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;min-width:0;min-height:44px;padding:9px 11px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;
}
.field textarea{min-height:92px;resize:vertical;font-family:var(--font-mono);font-size:15px}
.field input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:13px;color:var(--muted)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-err{padding:10px 12px;border-radius:6px;background:var(--danger-soft);color:var(--danger);font-size:14px;font-weight:500}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.form-actions .primary{flex:1 1 160px}

/* Seções */
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px}
.sec{font:600 21px/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;text-wrap:balance}
.stack{display:grid;gap:12px}
.rows{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.note{font-size:13px;color:var(--muted);margin-top:8px}

/* Indicadores */
.stats{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-top:12px;
}
.stat{padding:12px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 34px/1.05 var(--font-display);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v.neg{color:var(--danger)}
.stat .u{font-size:12px;color:var(--muted);line-height:1.25}

/* Brinco */
.tag{
  display:inline-flex;align-items:center;gap:6px;background:var(--tag);color:var(--tag-ink);
  font:500 14px/1.3 var(--font-mono);padding:2px 10px 2px 7px;border-radius:3px 10px 10px 3px;
  border:0;white-space:nowrap;
}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.32)}
.tag.big{font-size:22px;padding:4px 14px 4px 10px;border-radius:4px 14px 14px 4px}
.tag.big::before{width:8px;height:8px}
button.tag{cursor:pointer}
.nalert{margin-top:12px;padding:12px;border:1px solid var(--warn);border-left-width:5px;border-radius:6px;background:var(--warn-soft)}
.nalert b{display:block;margin-bottom:4px}
.nalert .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{padding:10px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;min-width:0}
.tile b{display:block;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.tile span{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.tile.okc b{color:var(--accent)}
.npc{border-left:6px solid var(--pc,var(--line))}
.npc .tile{background:color-mix(in srgb,var(--pc) 13%,var(--surface));border-color:color-mix(in srgb,var(--pc) 35%,var(--line))}
.npc .tile.fal{background:color-mix(in srgb,var(--sc) 16%,var(--surface));border-color:var(--sc)}
.npc .tile.fal b{color:var(--sc)}
.npc .lot-n{color:var(--pc)}
.toprow{display:flex;gap:12px;align-items:center;margin-top:10px}
.tiles2{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-width:0}
.tiles2 .tile{background:var(--accent-soft);border-color:transparent}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(0deg)}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-t b{font-size:18px}.ring-t span{font-size:10px;color:var(--muted);margin-top:-2px}
.split{display:flex;gap:14px;align-items:center;margin-top:12px}
.split svg{width:96px;height:96px;flex:none}
.split ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1;font-size:14px}
.split li{display:flex;align-items:center;gap:8px}.split li b{margin-left:auto}
.split li i{width:12px;height:12px;border-radius:3px;flex:none}
@media (max-width:430px){.toprow{flex-direction:column;align-items:stretch}.ring{align-self:center}}
.npc{margin-top:12px}
.tiles2c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.nprod{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.nprod h3{margin:0 0 6px;font-size:16px}
.pill{display:inline-block;font-size:12px;font-weight:600;line-height:1.5;padding:0 9px;border-radius:99px;white-space:nowrap}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.danger{color:var(--danger);background:var(--danger-soft)}
.pill.ok{color:var(--accent);background:var(--accent-soft)}
.pill.info{color:var(--muted);background:var(--bg);border:1px solid var(--line)}

/* Cartões de lote */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
button.lot{display:grid;gap:10px;width:100%;text-align:left;cursor:pointer}
button.lot:hover{border-color:var(--muted)}
.lot-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lot-n{font:600 24px/1.1 var(--font-display);letter-spacing:.02em;overflow-wrap:anywhere}
.lot-d{font-size:13px;color:var(--muted);white-space:nowrap}
.mini{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}
.mini b{font:600 20px/1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:3px}
.prog{display:grid;gap:4px}
.prog-bar{display:block;position:relative;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog-bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.prog-l{display:flex;justify-content:space-between;font:400 12px var(--font-mono);color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}

/* Linhas de lista */
button.arow{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;
  width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface);cursor:pointer;
}
button.arow:hover{border-color:var(--muted)}
.arow .main{min-width:0;display:grid;gap:2px}
.arow .t{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.arow .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.arow .r{text-align:right;display:grid;gap:2px}
.arow .r b{font:500 16px var(--font-mono);font-variant-numeric:tabular-nums}
.arow .r span{font:400 12px var(--font-mono);color:var(--muted)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .r{font:500 15px var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.alert{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.alert .l{display:grid;gap:3px;min-width:0;justify-items:start}
.alert .t{font-weight:600;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.filters .field label{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.bars{display:grid;gap:10px}
.bar-row{display:grid;gap:3px}
.bar-row .h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar-row .h span:last-child{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.bar-row .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar-row .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* Avisos e vazio */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--warn-soft);color:var(--ink);font-size:14px;border:1px solid var(--line)}
.banner.err{background:var(--danger-soft)}
.empty{margin-top:20px;padding:22px 16px;border:1px dashed var(--muted);border-radius:6px;display:grid;gap:10px;justify-items:start}
.empty h2{font:600 24px/1.1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.empty p{color:var(--muted);max-width:52ch}

/* Gráfico */
.chart{margin-top:12px}
.chart svg{display:block;width:100%;height:auto;max-width:100%}
.ch-grid{stroke:var(--line);stroke-width:1;fill:none}
.ch-txt{fill:var(--muted);font:11px var(--font-mono)}
.ch-val{fill:var(--ink);font:500 12px var(--font-mono)}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.ch-target{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.ch-tl{fill:var(--warn);font:11px var(--font-mono)}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 10px 4px}

/* Abas */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(4px,env(safe-area-inset-left,0px));
  padding-right:max(4px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav ul{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));max-width:720px;margin:0 auto;padding:0;list-style:none}
.nav a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;min-width:0;
  font-size:10.5px;font-weight:600;letter-spacing:0;color:var(--muted);text-decoration:none;white-space:nowrap;
}
@media (max-width:430px){.nav a{font-size:9px;letter-spacing:-.2px}.nav svg{width:20px;height:20px}}
.nav a[aria-current="page"]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Viabilidade */
.kv{display:grid}
.kv .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv .r span:first-child{color:var(--muted);min-width:0}
.kv .r span:last-child{font:500 15px var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.kv .r span.neg{color:var(--danger)}
.kv-h{margin-top:14px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.vcard{display:grid;gap:0}
.vcard .stats{margin-bottom:8px}
.sens-neg{color:var(--danger)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:4px 0 12px;background:var(--surface)}
.seg button{min-height:44px;border:0;background:transparent;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;padding:0 8px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-top:8px}
.ptabs button{flex:0 0 auto;min-height:40px;max-width:200px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ptabs button.add{border-style:dashed;color:var(--accent)}

.hero .top{position:relative;z-index:1;padding:14px 14px 78px;align-items:flex-start}
.hero .brand h1,.hero .brand p{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.hero .brand p{opacity:.92}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:12px;min-width:0}
.vcard .fc{background:var(--bg)}
.fc-verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0}
.fc-big{margin-top:10px}
.fc-k{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fc-n{font:700 52px/1.05 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fc-n.ok{color:var(--accent)}.fc-n.warn{color:var(--warn)}.fc-n.bad{color:var(--danger)}.fc-n.info{color:var(--muted)}
.fc-sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fc-sub span{display:block;font-size:12px;color:var(--muted)}
.fc-sub b{font:500 15px var(--font-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fc-h{margin:16px 0 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fc-bars .tr{height:14px}
.tr i.w{background:var(--warn)}
.fc-dn{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.dn-w{width:118px;height:118px;flex:0 0 auto}
.dn-w svg{display:block;width:100%;height:100%}
.dn{fill:none;stroke-width:6}
.dn-bg{fill:none;stroke:var(--line);stroke-width:6}
.dn-a{stroke:var(--c-an)}.dn-s{stroke:var(--warn)}.dn-o{stroke:var(--muted)}.dn-l{stroke:var(--accent)}
.dn-l{list-style:none;margin:0;padding:0;display:grid;gap:8px;flex:1 1 180px;min-width:0}
.dn-l li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;font-size:14px}
.dn-l b{font:600 14px var(--font-mono)}
.dn-l em{grid-column:2/4;font:400 12px var(--font-mono);color:var(--muted);font-style:normal}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}
.sw-a{background:var(--c-an)}.sw-s{background:var(--warn)}.sw-o{background:var(--muted)}.sw-l{background:var(--accent)}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.st-n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font:600 14px var(--font-mono)}
.st-t{font-weight:600}
.st-e{font:400 14px var(--font-mono);overflow-wrap:anywhere;margin-top:2px}
.st-e b{font-weight:600}
.st-h{margin:16px 0 4px;font:600 18px var(--font-display);letter-spacing:.03em;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.st-h span{font:400 13px var(--font-body);color:var(--muted);letter-spacing:0}
.stl{list-style:none;margin:0;padding:0}
.stl li{display:grid;grid-template-columns:minmax(92px,34%) minmax(0,1fr);gap:4px 10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.stl .st-k{color:var(--muted)}
.stl .st-v{font:400 13.5px var(--font-mono);overflow-wrap:anywhere}
details.more{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 14px}
details.more>summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
details.more[open]{padding-bottom:14px}
.vcard details.more{background:var(--bg)}

/* Folhas (detalhes e formulários) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,16,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:680px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
}
.sheet:focus{outline:none}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;background:var(--bg)}
.sheet-h h2{font:600 24px/1.1 var(--font-display);letter-spacing:.03em;overflow-wrap:anywhere}
.sheet-b{display:grid;gap:14px}
.sheet-b .sub{font-size:14px}
.sheet-b .stats{margin-top:0}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);
  bottom:calc(76px + env(safe-area-inset-bottom,0px));
  padding:10px 14px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;
}
.qw-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.qw-in input{min-height:56px;font:600 24px var(--font-mono);text-align:center}
.qw-prev{min-height:64px;margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.qw-prev .big{font:700 22px var(--font-mono)}
.qw-prev.bad{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.qw-list .hr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qw-list .hr:first-child{border-top:0}
.qw-list .r{font:500 13px var(--font-mono);text-align:right}
[hidden]{display:none!important}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
textarea.lst{min-height:150px;font-family:var(--font-mono);font-size:16px;line-height:1.5}
.fc-sup{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.fc-n2{font:700 34px/1.1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--warn);overflow-wrap:anywhere}
.fc-sup .stl{margin-top:8px}
.fc-oth{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;color:var(--muted)}

<script>
(function(){
'use strict';

/* ---------- constantes ---------- */
var VIEWS=['resumo','lotes','animais','sanidade','nutricao','custos','viabilidade'];
var FEED_CATS=['Ração','Sal mineral e suplemento'];
var ARR_MAX=1000;
function arrOk(p){return p>=50&&p<=ARR_MAX}
var LP={
  price:{f:'arrobaPrice',min:0,max:ARR_MAX,msg:'Informe o preço da @ até R$ 1.000, ou deixe em branco.'},
  yield:{f:'yieldPct',min:40,max:60,msg:'Informe o rendimento entre 40 e 60%.'},
  planDays:{f:'planDays',min:1,max:730,int:true,msg:'Informe o prazo entre 1 e 730 dias.'}
};
var PF={
  price:{min:0,max:100000,msg:'Informe o preço do produto.'},
  unitKg:{min:1,max:100,msg:'Informe o peso da saca entre 1 e 100 kg.'},
  qty:{min:0,max:10000000,msg:'Informe a quantidade total.'},
  intake:{min:0,max:100,msg:'Informe o consumo em kg por animal por dia.'},
  days:{min:1,max:730,int:true,msg:'Informe os dias de uso entre 1 e 730.'},
  pct:{min:0,max:10,msg:'Informe o consumo entre 0 e 10% do peso vivo.'},
  wFrom:{min:20,max:1500,msg:'Informe o peso de entrada no produto entre 20 e 1.500 kg.'},
  wTo:{min:20,max:1500,msg:'Informe o peso de saída do produto entre 20 e 1.500 kg.'}
};
var PTYPES=[['mineral','Mineral adensado',0.05],['prot-b','Proteinado de baixo consumo',0.1],['prot-m','Proteinado de médio consumo',0.2],['prot-a','Proteinado de alto consumo',0.3],['raca-b','Ração de baixo consumo',0.5],['raca-m','Ração de médio consumo',0.8],['raca-a','Ração de alto consumo',1]];
function ptypeOf(id){return PTYPES.filter(function(t){return t[0]===id})[0]||null}
function pctTxt(x){return String(x).replace('.',',')}
var UNITS=[['saca','Saca'],['kg','Quilo (kg)'],['tonelada','Tonelada']];
var PNAMES=['Sal mineral','Sal proteinado','Proteinado energético','Núcleo mineral','Ração','Milho moído','Farelo de soja','Farelo de algodão','Ureia','Melaço','Casca de soja','Polpa cítrica'];
var SIM={
  animals:{min:1,max:100000,int:true,msg:'Informe o número de animais.'},
  cost:{min:0,max:1000000,msg:'Informe o custo de compra por cabeça.'},
  wIn:{min:20,max:1500,msg:'Informe o peso de entrada entre 20 e 1.500 kg.'},
  wOut:{min:20,max:1500,msg:'Informe o peso de saída entre 20 e 1.500 kg.'},
  days:{min:1,max:730,int:true,msg:'Informe o prazo entre 1 e 730 dias.'},
  other:{min:0,max:1000000,msg:'Informe os outros custos por cabeça.'},
  price:{min:0,max:ARR_MAX,msg:'Informe o preço da @ até R$ 1.000, ou deixe em branco.'},
  yield:{min:40,max:60,msg:'Informe o rendimento entre 40 e 60%.'}
};
var COST_CATS=['Ração','Sal mineral e suplemento','Sanidade','Mão de obra','Pasto e instalações','Frete','Outros'];
var EVENT_KINDS=['Vacina','Vermífugo','Carrapaticida','Tratamento','Outro'];
var PRODUCTS=['Clostridioses','Botulismo','Raiva','Ivermectina','Albendazol','Antibiótico','Anti-inflamatório','Complexo vitamínico'];
var DEFAULT_CFG={farm:'',arrobaPrice:0,refPrice:0,refDate:'',yieldPct:52};
var LOW_GMD=0.5;      /* kg/dia: abaixo disso o animal entra em "observar" */
var STALE_DAYS=30;    /* dias sem pesar o lote */

/* ---------- estado ---------- */
var S={
  db:null,canWrite:true,revoked:false,slow:false,cfg:Object.assign({},DEFAULT_CFG),
  lots:[],events:[],costs:[],fcosts:[],ctab:'lote',sim:{},vmode:null,ptab:{},later:{},vtab:{},draft:{sim:{},prod:{}},more:{},
  loaded:{lots:false,events:false,costs:false,fcosts:false,cfg:false,sim:false},
  confirmed:{lots:false,events:false,costs:false,fcosts:false,cfg:false,sim:false},
  view:'resumo',flt:{q:'',lot:'',st:'A',slot:'',clot:''},shown:100,
  sheets:[],lastFocus:null,sheetKey:null
};

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
var _c=0;
function uid(){return Date.now().toString(36)+(_c++).toString(36)+Math.random().toString(36).slice(2,5)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function parseISO(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function dayDiff(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000)}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function brDate(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):''}
function brShort(s){return s?s.slice(8,10)+'/'+s.slice(5,7):''}
var NF0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
var NF1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
var NF2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
var BRL0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
function ok(v){return v!=null&&isFinite(v)}
function n0(v){return ok(v)?NF0.format(v):'—'}
function n1(v){return ok(v)?NF1.format(v):'—'}
function n2(v){return ok(v)?NF2.format(v):'—'}
function brl(v){return ok(v)?BRL.format(v):'—'}
function brl0(v){return ok(v)?(v<0?'−':'')+BRL0.format(Math.abs(v)):'—'}
function plural(n,a,b){return n+' '+(n===1?a:b)}
function parseNum(s){
  s=String(s==null?'':s).trim().replace(/\s/g,'').replace(/^R\$/,'');
  if(!s) return NaN;
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  var n=Number(s);return isFinite(n)?n:NaN;
}
function parseTags(txt){
  var out=[],seen={};
  function push(t){if(!seen[t]){seen[t]=1;out.push(t)}}
  String(txt||'').split(/[\s,;]+/).filter(Boolean).forEach(function(tok){
    var m=tok.match(/^(\d+)-(\d+)$/);
    if(m){
      var a=+m[1],b=+m[2],w=m[1].length;
      if(b>=a&&b-a<=999){for(var i=a;i<=b;i++) push(m[1].charAt(0)==='0'?String(i).padStart(w,'0'):String(i));return}
    }
    push(tok.slice(0,12));
  });
  return out;
}
function tagCmp(a,b){return String(a.tag).localeCompare(String(b.tag),'pt-BR',{numeric:true})}
function lotById(id){return S.lots.find(function(l){return l.id===id})}
function toObj(d){return Object.assign({id:d.id},d.data())}

/* ---------- cálculos ---------- */
function endPoint(a){
  var l=a.ws[a.ws.length-1];
  if(a.st==='S'&&a.out&&a.out.weight) return [a.out.date,a.out.weight];
  return l;
}
function aInfo(a){
  var f=a.ws[0],l=a.ws[a.ws.length-1],e=endPoint(a);
  var days=dayDiff(f[0],e[0]),gain=e[1]-f[1],recent=null;
  if(a.ws.length>=2){var p=a.ws[a.ws.length-2],d=dayDiff(p[0],l[0]);if(d>0) recent=(l[1]-p[1])/d}
  return {first:f,last:l,cur:e[1],days:days,gain:gain,gmd:days>0?gain/days:null,recent:recent};
}
function lotSeries(lot){
  var act=(lot.animals||[]).filter(function(a){return a.st!=='D'});
  var by={};
  act.forEach(function(a){a.ws.forEach(function(w){(by[w[0]]=by[w[0]]||[]).push(w[1])})});
  var need=Math.max(1,Math.ceil(act.length*0.5));
  return Object.keys(by).sort().filter(function(d){return by[d].length>=need}).map(function(d){
    return {d:d,v:by[d].reduce(function(s,x){return s+x},0)/by[d].length};
  });
}
function lotStats(lot){
  var all=lot.animals||[];
  var live=all.filter(function(a){return a.st==='A'});
  var sold=all.filter(function(a){return a.st==='S'});
  var dead=all.filter(function(a){return a.st==='D'});
  var base=live.length?live:sold;
  var bi=base.map(aInfo);
  var avg=bi.length?bi.reduce(function(s,i){return s+i.cur},0)/bi.length:null;
  var avgIn=bi.length?bi.reduce(function(s,i){return s+i.first[1]},0)/bi.length:null;
  var gi=all.filter(function(a){return a.st!=='D'}).map(aInfo);
  var sumGain=gi.reduce(function(s,i){return s+i.gain},0);
  var gd=gi.filter(function(i){return i.days>0});
  var sumDays=gd.reduce(function(s,i){return s+i.days},0);
  var gmd=sumDays>0?gd.reduce(function(s,i){return s+i.gain},0)/sumDays:null;
  var firsts=all.map(function(a){return a.ws[0][0]}).sort();
  var first=firsts[0]||null;
  var lastWeigh=live.map(function(a){return a.ws[a.ws.length-1][0]}).sort().pop()||null;
  var closed=lot.status==='closed';
  var end=closed?(lot.closedAt||today()):today();
  var daysOn=first?Math.max(0,dayDiff(first,end)):0;
  var fc=null;
  if(!closed&&avg!=null&&lot.target>0){
    if(avg>=lot.target) fc={reached:true};
    else if(gmd>0){var d=Math.ceil((lot.target-avg)/gmd);fc={days:d,date:addDays(today(),d)}}
  }
  var y=((lot.sale&&lot.sale.yieldPct)||lot.yieldPct||S.cfg.yieldPct||52)/100;
  var price=arrOk(lot.arrobaPrice)?lot.arrobaPrice:0;
  var acq=all.reduce(function(s,a){return s+(a.cost||0)},0)+(lot.freight||0)+(lot.entryOther||0);
  var costs=S.costs.filter(function(c){return c.lotId===lot.id}).reduce(function(s,c){return s+(c.amount||0)},0);
  var arrobasProd=sumGain*y/15;
  var realized=sold.reduce(function(s,a){return s+((a.out&&a.out.revenue)||0)},0);
  var liveKg=live.reduce(function(s,a){return s+aInfo(a).cur},0);
  var estimated=liveKg*y/15*price;
  var result=price>0?realized+estimated-acq-costs:(live.length?null:realized-acq-costs);
  return {
    y:y,price:price,nLive:live.length,nSold:sold.length,nDead:dead.length,avg:avg,avgIn:avgIn,gmd:gmd,
    sumGain:sumGain,sumDays:sumDays,sumCur:liveKg,first:first,lastWeigh:lastWeigh,daysOn:daysOn,fc:fc,
    acq:acq,costs:costs,arrobasProd:arrobasProd,costPerArroba:arrobasProd>0?costs/arrobasProd:null,
    realized:realized,estimated:estimated,result:result,series:lotSeries(lot)
  };
}
function aggregate(lots){
  var n=0,kg=0,gain=0,days=0,costs=0,arr=0,res=0,unknown=false;
  lots.forEach(function(l){
    var s=lotStats(l);
    n+=s.nLive;kg+=s.sumCur;gain+=s.sumGain;days+=s.sumDays;costs+=s.costs;arr+=s.arrobasProd;
    if(s.result==null) unknown=true;else res+=s.result;
  });
  return {n:n,avg:n?kg/n:null,gmd:days>0?gain/days:null,costPerArroba:arr>0?costs/arr:null,arr:arr,result:(unknown||!lots.length)?null:res};
}
function carencias(lot){
  var t=today(),res={lot:null,animals:{}};
  S.events.forEach(function(e){
    if(e.lotId!==lot.id||!(e.carencia>0)) return;
    var until=addDays(e.date,e.carencia);
    if(until<=t) return;
    if(e.tag){var c=res.animals[e.tag];if(!c||until>c.until) res.animals[e.tag]={until:until,product:e.product}}
    else if(!res.lot||until>res.lot.until) res.lot={until:until,product:e.product};
  });
  return res;
}
function upsertW(a,date,w){
  w=Math.round(w*10)/10;
  var i=a.ws.findIndex(function(x){return x[0]===date});
  if(i>=0) a.ws[i][1]=w;else a.ws.push([date,w]);
  a.ws.sort(function(x,y){return x[0]<y[0]?-1:x[0]>y[0]?1:0});
}

/* ---------- viabilidade ---------- */
function feedStats(lot,s){
  var cs=S.costs.filter(function(c){return c.lotId===lot.id&&FEED_CATS.indexOf(c.cat)>=0});
  var cost=0,kg=0,costQ=0,nq=0;
  cs.forEach(function(c){cost+=c.amount||0;if(c.qty>0){kg+=c.qty;costQ+=c.amount||0;nq++}});
  return {n:cs.length,nq:nq,cost:cost,kg:kg,
    perKg:kg>0?costQ/kg:null,
    perAnimalDay:kg>0&&s.sumDays>0?kg/s.sumDays:null,
    ca:kg>0&&s.sumGain>0?kg/s.sumGain:null,
    costPerGain:s.sumGain>0&&cost>0?cost/s.sumGain:null,
    share:s.costs>0?cost/s.costs:null};
}
function viability(lot){
  var s=lotStats(lot),f=feedStats(lot,s),price=s.price||0;
  var valueKg=price*s.y/15;
  var invested=s.acq+s.costs,netCost=invested-s.realized;

function prodCalc(products,n,days,w){
  w=w||{};
  var rows=products.map(function(p){
    var u=unitKgOf(p),pd=p.days>0?p.days:days,kg=0,method='',avgW=null;
    var wf=p.wFrom>0?p.wFrom:(w.from>0?w.from:0),wt=p.wTo>0?p.wTo:(w.to>0?w.to:0);
    if(p.qty>0){kg=p.qty*u;method='qty'}
    else if(p.pct>0&&wf>0&&wt>0&&n>0&&pd>0){avgW=(wf+wt)/2;kg=p.pct/100*avgW*n*pd;method='pct'}
    else if(p.intake>0&&n>0&&pd>0){kg=p.intake*n*pd;method='intake'}
    var units=kg/u,bs=p.buys||[],bq=0,bsp=0;
    bs.forEach(function(b){bq+=b.qty||0;bsp+=(b.qty||0)*(b.price||0)});
    var miss=Math.max(0,units-bq),cost=bsp+(p.price>0?miss*p.price:0);
    return {p:p,kg:kg,units:units,cost:cost,pd:pd,method:method,avgW:avgW,wf:wf,wt:wt,over:(p.days>0&&days>0&&p.days>days),
      perDay:(n>0&&days>0)?kg/(n*days):0,perUse:(n>0&&pd>0)?kg/(n*pd):0,noPrice:kg>0&&!(p.price>0)&&miss>0.0001,bought:bq,spent:bsp,miss:miss,avgPaid:bq>0?bsp/bq:null,nbuys:bs.length};
  });
  var t={kg:0,cost:0,perDay:0,noPrice:0,over:0,n:rows.length};
  rows.forEach(function(r){t.kg+=r.kg;t.cost+=r.cost;t.perDay+=r.perDay;if(r.noPrice) t.noPrice++;if(r.over) t.over++});
  return {rows:rows,t:t};
}

function simCalc(){
  var m=liveSim(),n=m.animals,wi=m.wIn,wo=m.wOut,d=m.days;
  if(!(n>0&&wi>0&&wo>0&&d>0)) return null;
  var y=(m.yield>0?m.yield:(S.cfg.yieldPct||52))/100,p=arrOk(m.price)?m.price:0;
  var pc=prodCalc(getProducts(m),n,d,{from:wi,to:wo}),tot=pc.t;
  var feedKg=tot.kg,feedCost=(tot.kg>0&&!(tot.cost>0))?null:tot.cost;
  var buy=n*(m.cost||0),other=n*(m.other||0),inv=buy+other+(feedCost||0);
  var gainPer=wo-wi,gainTot=n*gainPer,gmd=gainPer/d;
  var arrPer=wo*y/15,arrTot=n*arrPer,valueKg=p>0?p*y/15:null;
  var rev=p>0?arrTot*p:null,res=rev!=null?rev-inv:null;
  return {n:n,wi:wi,wo:wo,d:d,y:y,p:p,pc:pc,nProd:tot.n,noPrice:tot.noPrice,feedKg:feedKg,feedCost:feedCost,buy:buy,other:other,inv:inv,
    gainPer:gainPer,gainTot:gainTot,gmd:gmd,arrPer:arrPer,arrTot:arrTot,valueKg:valueKg,rev:rev,res:res,
    be:arrTot>0?inv/arrTot:null,beW:p>0?inv/(n*y/15*p):null,
    prodCost:(gainTot>0)?((feedCost||0)+other)/(n*gainPer*y/15):null,
    roi:(res!=null&&inv>0)?res/inv:null,
    perDay:feedKg>0?feedKg/(n*d):null,ca:(feedKg>0&&gainTot>0)?feedKg/gainTot:null};
}

async function saveSim(t){

/* ---------- gráfico ---------- */
function niceTicks(lo,hi,n){
  var span=(hi-lo)||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),norm=raw/mag;
  var step=(norm<=1?1:norm<=2?2:norm<=5?5:10)*mag;
  var start=Math.floor(lo/step)*step,end=Math.ceil(hi/step)*step,t=[];
  for(var v=start;v<=end+step*1e-6;v+=step) t.push(v);
  return {ticks:t,lo:start,hi:end};
}
function lineChart(pts,opts){
  opts=opts||{};
  if(!pts.length) return '<p class="muted small">Sem pesagens ainda.</p>';
  var W=320,H=176,L=42,R=14,T=16,B=26;
  var xs=pts.map(function(p){return parseISO(p.d).getTime()});
  var lo=Math.min.apply(null,pts.map(function(p){return p.v}));
  var hi=Math.max.apply(null,pts.map(function(p){return p.v}));
  if(opts.target) hi=Math.max(hi,opts.target);
  var pd=(hi-lo)*0.08||10;
  var nt=niceTicks(lo-pd,hi+pd,4);
  var x0=xs[0],x1=xs[xs.length-1];
  if(x1===x0) x1=x0+7*86400000;
  function X(t){return L+(t-x0)/(x1-x0)*(W-L-R)}
  function Y(v){return T+(1-(v-nt.lo)/(nt.hi-nt.lo))*(H-T-B)}
  var g='';
  nt.ticks.forEach(function(v){
    g+='<line class="ch-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/>';
    g+='<text class="ch-txt" x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+NF0.format(v)+'</text>';
  });
  if(opts.target){
    var ty=Y(opts.target).toFixed(1);
    g+='<line class="ch-target" x1="'+L+'" x2="'+(W-R)+'" y1="'+ty+'" y2="'+ty+'"/>';
    g+='<text class="ch-tl" x="'+(L+4)+'" y="'+(Y(opts.target)-5).toFixed(1)+'">alvo '+NF0.format(opts.target)+' kg</text>';
  }
  g+='<text class="ch-txt" x="'+L+'" y="'+(H-8)+'" text-anchor="start">'+brShort(pts[0].d)+'</text>';
  if(pts.length>1) g+='<text class="ch-txt" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+brShort(pts[pts.length-1].d)+'</text>';
  var line=pts.map(function(p,i){return X(xs[i]).toFixed(1)+','+Y(p.v).toFixed(1)}).join(' ');
  if(pts.length>1) g+='<polyline class="ch-line" points="'+line+'"/>';
  pts.forEach(function(p,i){
    var last=i===pts.length-1;
    g+='<circle class="ch-dot" cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?4.5:3)+'"/>';
  });
  var lp=pts[pts.length-1],lx=X(xs[xs.length-1]),ly=Y(lp.v);
  var anchor=lx>W-48?'end':'middle';
  g+='<text class="ch-val" x="'+lx.toFixed(1)+'" y="'+(ly-9).toFixed(1)+'" text-anchor="'+anchor+'">'+NF0.format(lp.v)+' kg</text>';
  var label='Peso em kg ao longo do tempo, de '+brDate(pts[0].d)+' a '+brDate(lp.d)+'. Último valor: '+NF0.format(lp.v)+' kg.';
  return '<div class="chart-box"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'+g+'</svg></div>';
}

  if(a.st==='A'&&(car.animals[a.tag]||car.lot)) flags+=' <span class="pill warn">Carência</span>';

  if(a.st==='S') sub.push('vendido '+brShort(a.out&&a.out.date));
  if(a.st==='D') sub.push('óbito '+brShort(a.out&&a.out.date));
  return '<button type="button" class="arow" data-act="open-animal" data-lot="'+lot.id+'" data-id="'+a.id+'">'+
    tagChip(a.tag)+'<span class="main"><span class="t">'+sub.join(' · ')+flags+'</span></span>'+
    '<span class="r"><b>'+n0(i.cur)+' kg</b><span>'+(i.gmd!=null?n2(i.gmd)+' kg/dia':'—')+'</span></span></button>';

/* ---------- avisos do resumo ---------- */
function buildAlerts(){
  var out=[],t=today();
  S.events.forEach(function(e){
    if(!e.nextDate||e.nextDone) return;
    var lot=lotById(e.lotId);if(!lot||lot.status==='closed') return;
    var d=dayDiff(t,e.nextDate);if(d>7) return;
    var label=d<0?'Vencido há '+plural(-d,'dia','dias'):d===0?'Vence hoje':'Vence em '+plural(d,'dia','dias');
    out.push({rank:d<0?0:1,d:d,cls:d<0?'danger':d<=2?'warn':'info',label:label,
      title:esc(e.kind+(e.product?': '+e.product:'')),
      sub:esc(lot.name)+(e.tag?' · brinco '+esc(e.tag):' · lote todo')+' · previsto '+brDate(e.nextDate),
      extra:'',btn:'<button type="button" class="btn small" data-act="redo-event" data-id="'+e.id+'">Registrar</button>'});
  });
  S.lots.filter(function(l){return l.status!=='closed'}).forEach(function(lot){
    var s=lotStats(lot);
    if(s.nLive&&s.lastWeigh){
      var dd=dayDiff(s.lastWeigh,t);
      if(dd>STALE_DAYS) out.push({rank:2,d:-dd,cls:'warn',label:'Pesagem atrasada',title:esc(lot.name),
        sub:'Última pesagem há '+plural(dd,'dia','dias')+' ('+brDate(s.lastWeigh)+')',extra:'',
        btn:'<button type="button" class="btn small" data-act="weigh-lot" data-id="'+lot.id+'">Pesar</button>'});
    }
    var low=lot.animals.filter(function(a){return a.st==='A'}).map(function(a){return {a:a,i:aInfo(a)}})
      .filter(function(x){return x.i.recent!=null&&x.i.recent<LOW_GMD}).sort(function(x,y){return tagCmp(x.a,y.a)});
    if(low.length){
      var chips=low.slice(0,8).map(function(x){return '<button type="button" class="tag" data-act="open-animal" data-lot="'+lot.id+'" data-id="'+x.a.id+'">'+esc(x.a.tag)+'</button>'}).join('');
      if(low.length>8) chips+='<span class="muted small">+'+(low.length-8)+'</span>';
      out.push({rank:3,d:0,cls:'warn',label:'Observar',title:esc(lot.name),
        sub:plural(low.length,'animal ganhou','animais ganharam')+' menos de '+n2(LOW_GMD)+' kg/dia na última pesagem',
        extra:'<span class="chips">'+chips+'</span>',btn:''});
    }
    var car=carencias(lot);
    if(car.lot) out.push({rank:4,d:0,cls:'info',label:'Carência',title:esc(lot.name),
      sub:esc(car.lot.product||'Produto aplicado')+' · liberado a partir de '+brDate(car.lot.until),extra:'',btn:''});
  });
  out.sort(function(a,b){return a.rank-b.rank||a.d-b.d});
  return out;
}

function banners(){
  var h='';

  if(!S.db&&S.loaded.lots) h+='<div class="banner err">Os dados não podem ser salvos nesta visualização. Abra a Caderneta pelo Claude para registrar.</div>';
  if(S.revoked) h+='<div class="banner err">Seu acesso a estes dados mudou. Recarregue a página.</div>';
  if(S.slow) h+='<div class="banner">Ainda não foi possível buscar os dados mais recentes. O que aparece pode estar desatualizado.</div>';
  if(S.db&&!S.canWrite) h+='<div class="banner">Você só pode ver estes dados. Para registrar, peça acesso de edição ao dono.</div>';
  var ex=S.lots.some(function(l){return l.example})||S.events.some(function(e){return e.example})||S.costs.some(function(c){return c.example});
  if(ex) h+='<div class="banner"><span><b>Dados de exemplo.</b> Preço da @ e rendimento também são exemplos: confira em Ajustes.</span><button type="button" class="btn small danger" data-act="clear-examples" data-confirm="Toque de novo para apagar">Apagar exemplos</button></div>';

}
function viewResumo(){
  if(!S.loaded.lots) return loadingHtml();

  var open=S.lots.filter(function(l){return l.status!=='closed'});
  var ag=aggregate(open);
  var res=ag.result!=null?(ag.result<0?'−'+n0(-ag.result):n0(ag.result)):'—';
  var h='<div class="stats" role="group" aria-label="Rebanho em engorda">'+
    stat('Animais',n0(ag.n),'em engorda')+stat('Peso médio',n0(ag.avg),'kg vivo')+stat('GMD',n2(ag.gmd),'kg/dia')+'</div>';

    stat('Custo da @',n2(ag.costPerArroba),'R$ por @ produzida')+stat('@ produzidas',n1(ag.arr),'de carcaça')+
    stat('Resultado',res,'R$ estimado',(ag.result!=null&&ag.result<0)?'neg':'')+'</div>';
  h+='<p class="note">GMD é o ganho médio diário. @ de carcaça = peso vivo × rendimento ('+S.cfg.yieldPct+'%) ÷ 15 kg. O preço da @ é informado em cada lote, na aba Viabilidade; o resultado só soma lotes que tenham preço.</p>';

  h+='<div class="vh"><h2 class="sec">Lotes em andamento</h2><button type="button" class="btn small" data-act="new-lot">Novo lote</button></div>';

function renderAnimalList(){
  var box=$('#animal-list');if(!box) return;
  var q=S.flt.q.trim().toLowerCase(),res=[];
  S.lots.forEach(function(lot){
    if(S.flt.lot&&lot.id!==S.flt.lot) return;
    if(lot.grp){if(!q&&(S.flt.st==='A'||S.flt.st==='all')&&lot.status!=='closed') res.push({lot:lot,grp:true});return}
    (lot.animals||[]).slice().sort(tagCmp).forEach(function(a){
      if(S.flt.st!=='all'&&a.st!==S.flt.st) return;
      if(q&&String(a.tag).toLowerCase().indexOf(q)<0) return;

    });
  });
  var cut=res.slice(0,S.shown);
  $('#a-count').textContent=plural(res.length,'animal','animais');
  if(!res.length){box.innerHTML='<p class="muted">Nenhum animal encontrado com esses filtros.</p>';return}
  box.innerHTML=cut.map(function(x){if(x.grp){var gs=lotStats(x.lot);return '<button type="button" class="arow" data-act="open-lot" data-id="'+x.lot.id+'"><span class="tag">Lote</span><span class="main"><span class="t">'+esc(x.lot.name)+' · '+plural(gs.nLive,'animal','animais')+' sem identificação</span></span><span class="r"><b>'+n0(gs.avg)+' kg</b><span>'+(gs.gmd!=null?n2(gs.gmd)+' kg/dia':'—')+'</span></span></button>'}return animalRow(x.lot,x.a,true)}).join('')+
    (res.length>cut.length?'<button type="button" class="btn" data-act="more-animals">Mostrar mais ('+(res.length-cut.length)+')</button>':'');
}

/* ---------- nutrição ---------- */
function qtyTxt(p,q){
  if(p.unit==='kg') return n0(q)+' kg';
  if(p.unit==='tonelada') return n1(q)+' t';
  var whole=Math.abs(q-Math.round(q))<0.05;
  return (whole?n0(q):n1(q))+(Math.round(q)===1?' saca':' sacas');
}
function nutriAlerts(lot,s,pc,closed){
  if(s.avg==null||!s.lastWeigh) return '';
  var dec=lot.nutriDec||{},h='';
  pc.rows.forEach(function(r){
    var p=r.p,lim=p.wTo;
    if(!(lim>0)||s.avg<lim) return;
    if(pc.rows.some(function(o){return o!==r&&o.p.wFrom>=lim})) return;
    if(dec[p.id]===s.lastWeigh) return;
    if(S.later[lot.id+'|'+p.id+'|'+s.lastWeigh]) return;
    h+='<div class="nalert" role="alert"><b>'+esc(p.name||'Produto')+': o lote chegou a '+n0(s.avg)+' kg</b>'+
      'O limite deste produto é '+n0(lim)+' kg (última pesagem em '+brDate(s.lastWeigh)+'). Vai continuar no produto ou trocar?'+
      '<div class="actions"><button type="button" class="btn" data-act="nutri-keep" data-id="'+lot.id+'" data-pid="'+p.id+'">Manter produto</button>'+
      '<button type="button" class="btn primary" data-act="nutri-swap" data-id="'+lot.id+'" data-pid="'+p.id+'">Trocar de produto</button>'+
      '<button type="button" class="btn" data-act="nutri-later" data-id="'+lot.id+'" data-pid="'+p.id+'">Decidir depois</button></div>'+
      '<p class="hint" style="margin-top:8px">O app nunca troca sozinho. Se mantiver, o app pergunta de novo na próxima pesagem.'+(closed?' Para trocar, toque em Editar nutrição.':'')+'</p></div>';
  });
  return h;
}

function drawSheet(fresh){
  var root=$('#sheet-root'),def=S.sheets[S.sheets.length-1];
  if(!def){
    root.hidden=true;root.innerHTML='';document.body.classList.remove('sheet-open');S.sheetKey=null;
    if(S.lastFocus&&S.lastFocus.focus&&S.lastFocus.isConnected){try{S.lastFocus.focus()}catch(e){}}
    S.lastFocus=null;return;
  }
  var prev=root.querySelector('.sheet'),st=(prev&&!fresh)?prev.scrollTop:0;
  root.hidden=false;document.body.classList.add('sheet-open');
  var many=S.sheets.length>1;
  root.innerHTML='<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">'+
    '<div class="sheet-h"><h2 id="sheet-title">'+esc(def.title())+'</h2><button type="button" class="btn small" data-act="back">'+(many?'Voltar':'Fechar')+'</button></div>'+

function errText(e){
  var c=e&&e.code;
  if(c==='quota_exceeded') return 'Limite de armazenamento atingido. Exclua registros antigos.';
  if(c==='resource_exhausted') return 'Muitas gravações seguidas. Aguarde um instante e tente de novo.';
  if(c==='invalid_argument') return 'Não foi possível salvar. Você pode estar sem permissão de edição.';
  if(c==='revoked') return 'Seu acesso mudou. Recarregue a página.';
  return 'Não foi possível salvar. Tente de novo.';
}
async function write(okMsg,fn){
  if(!S.db){toast('Armazenamento indisponível nesta visualização.');return false}
  if(!S.canWrite){toast('Você só pode ver estes dados.');return false}
  for(var i=0;i<2;i++){
    try{await fn();if(okMsg) toast(okMsg);return true}
    catch(e){
      if(e&&e.code==='unavailable'&&i===0){await sleep(300+Math.random()*500);continue}
      toast(errText(e));return false;
    }
  }
  return false;
}

function qwFind(lot,tag){
  var t=String(tag||'').trim().toLowerCase();if(!t) return null;
  return lot.animals.find(function(a){return String(a.tag).trim().toLowerCase()===t})||(/^\d+$/.test(t)?lot.animals.find(function(a){return String(a.tag).trim().toLowerCase()==='sn'+t}):null)||null;
}
function qwPrev(a,date){
  var p=null;a.ws.forEach(function(w){if(w[0]<date) p=w});return p;
}
function qwCalc(a,date,w){
  var p=qwPrev(a,date),f=a.ws[0],r={prev:p,diff:null,gmd:null,gmdAll:null};
  if(p){r.diff=w-p[1];var d=dayDiff(p[0],date);if(d>0) r.gmd=r.diff/d}
  if(f&&f[0]<date){var d2=dayDiff(f[0],date);if(d2>0) r.gmdAll=(w-f[1])/d2}
  return r;
}
function qwLine(r){
  if(!r.prev) return 'primeira pesagem deste animal';
  var s=(r.diff>=0?'+':'−')+n1(Math.abs(r.diff))+' kg';
  if(r.gmd!=null) s+=' · <b>'+n2(r.gmd)+' kg/dia</b> desde '+brShort(r.prev[0]);
  return s;
}
function qwPreview(){
  var box=document.getElementById('qw-prev'),f=box&&box.closest('form');if(!f) return;
  var lot=lotById(f.dataset.id),tag=f.elements.tag.value.trim(),wv=f.elements.w.value.trim(),date=f.elements.date.value||today();
  box.className='qw-prev';
  if(!lot||!tag){box.innerHTML='<span class="muted">Digite o brinco e o peso do animal que subiu na balança.</span>';return}
  var a=qwFind(lot,tag);
  if(!a){box.classList.add('bad');box.innerHTML='<b>Animal não identificado</b> · brinco '+esc(tag)+' não está neste lote.';return}
  if(a.st!=='A'){box.classList.add('bad');box.innerHTML='<b>Animal já saiu do lote</b> · brinco '+esc(a.tag)+'.';return}
  var l=a.ws[a.ws.length-1],h=tagChip(a.tag)+' <span class="muted">último '+n1(l[1])+' kg em '+brShort(l[0])+'</span>';
  var w=parseNum(wv);
  if(!wv){box.innerHTML=h;return}
  if(!(w>=20&&w<=1500)){box.classList.add('bad');box.innerHTML=h+'<br><b>Confira o peso</b> (entre 20 e 1.500 kg).';return}
  var r=qwCalc(a,date,w);
  box.innerHTML=h+'<div class="big">'+(r.gmd!=null?n2(r.gmd)+' kg/dia':(r.diff!=null?(r.diff>=0?'+':'−')+n1(Math.abs(r.diff))+' kg':'—'))+'</div><span class="muted">'+qwLine(r)+(r.gmdAll!=null?' · desde a entrada '+n2(r.gmdAll)+' kg/dia':'')+'</span>';
}

/* ---------- gravação dos formulários ---------- */
function parseEntries(txt){
  var items=[],errors=[],seen={};
  String(txt||'').split(/\r?\n/).forEach(function(line,i){
    line=line.trim();if(!line) return;
    var tk=line.split(/[\s;]+/).filter(Boolean),n=i+1;
    if(tk.length!==2){errors.push('Linha '+n+': escreva o brinco e o peso, por exemplo 151 340');return}
    var tag=tk[0].replace(/[,:=]+$/,'');
    if(tk[1]==='?'){errors.push('Linha '+n+': falta o peso'+(tag!=='-'?' do brinco '+tag:' do animal'));return}
    var w=parseNum(tk[1]);
    if(!tag){errors.push('Linha '+n+': brinco vazio');return}
    if(tag==='-'){if(!(w>=20&&w<=1500)){errors.push('Linha '+n+': peso entre 20 e 1.500 kg');return}items.push({tag:null,w:Math.round(w*10)/10});return}
    if(!(w>=20&&w<=1500)){errors.push('Linha '+n+': peso entre 20 e 1.500 kg');return}
    parseTags(tag).forEach(function(t){
      if(seen[t.toLowerCase()]){errors.push('Linha '+n+': o brinco '+t+' está repetido');return}
      seen[t.toLowerCase()]=1;items.push({tag:t,w:Math.round(w*10)/10});
    });
  });
  return {items:items,errors:errors};
}
function nextSn(lot,items){
  var mx=0;
  (lot&&lot.animals||[]).map(function(a){return a.tag}).concat(items.map(function(i){return i.tag||''})).forEach(function(t){
    var m=String(t).match(/^sn\s*(\d+)$/i);if(m&&+m[1]>mx) mx=+m[1];
  });
  return mx+1;
}
function entryData(fd,lot){
  if(fd.get('mode')==='noid'){
    var q=Math.round(parseNum(fd.get('gq'))),w=parseNum(fd.get('gw')),it=[],er=[];
    if(fd.get('gq')&&!(q>0)) er.push('Informe a quantidade de animais');
    else if(q>999) er.push('No máximo 999 animais por vez');
    else if(q>0){
      if(!(w>=20&&w<=1500)) er.push('Informe o peso médio, entre 20 e 1.500 kg');
      else{var mx=0;(lot&&lot.animals||[]).forEach(function(a){var m=String(a.tag).match(/^G(\d+)$/);if(m&&+m[1]>mx) mx=+m[1]});
        for(var i=0;i<q;i++) it.push({tag:'G'+(mx+1+i),w:Math.round(w*10)/10})}
    }
    return {items:it,errors:er};
  }
  var pe=parseEntries(fd.get('lst')),items=pe.items,errors=pe.errors.slice();
  var k0=nextSn(lot,items);
  items.forEach(function(i){if(i.tag===null) i.tag='SN'+(k0++)});
  if(lot&&lot.animals){
    var have={};lot.animals.forEach(function(a){have[String(a.tag).trim().toLowerCase()]=1});
    items.forEach(function(i){if(have[i.tag.toLowerCase()]) errors.push('O brinco '+i.tag+' já existe neste lote')});
  }
  if(fd.get('hasSn')){
    var q=Math.round(parseNum(fd.get('snq'))),w=parseNum(fd.get('snw'));
    if(q>0){
      if(!(w>=20&&w<=1500)) errors.push('Sem numeração: informe o peso médio, entre 20 e 1.500 kg');
      else if(q>999) errors.push('Sem numeração: no máximo 999 animais por vez');
      else{var k=nextSn(lot,items);for(var i=0;i<q;i++) items.push({tag:'SN'+(k+i),w:Math.round(w*10)/10})}
    }
  }
  return {items:items,errors:errors};
}

function gridSync(f){
  var gr=f.querySelector('#gr');if(!gr) return;
  var rows=[].slice.call(gr.querySelectorAll('.gr-row')),lines=[];
  rows.forEach(function(r){
    var t=r.querySelector('.gr-t').value.trim(),w=r.querySelector('.gr-w').value.trim();
    lines.push(!t&&!w?'':(t||'-')+'\t'+(w||'?'));
  });
  f.elements.lst.value=lines.join('\n');
  var last=rows[rows.length-1];
  if(last&&(last.querySelector('.gr-t').value||last.querySelector('.gr-w').value)){
    for(var k=0;k<3;k++) gr.insertAdjacentHTML('beforeend',gridRow(gr.querySelectorAll('.gr-row').length));
  }
  entrySummary(f);
}
function gridPaste(inp_,text){
  var f=inp_.form,gr=f.querySelector('#gr'),start=[].slice.call(gr.querySelectorAll('.gr-row')).indexOf(inp_.closest('.gr-row'));
  var lines=text.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  lines.forEach(function(l,k){
    while(gr.querySelectorAll('.gr-row').length<=start+k+1) gr.insertAdjacentHTML('beforeend',gridRow(gr.querySelectorAll('.gr-row').length));
    var r=gr.querySelectorAll('.gr-row')[start+k],tk=l.split(/[\s;\t]+/).filter(Boolean);
    if(tk.length>=2){r.querySelector('.gr-t').value=tk[0];r.querySelector('.gr-w').value=tk[tk.length-1]}
    else r.querySelector('.gr-t').value=tk[0]||'';
  });
  gridSync(f);
}
function entrySummary(f){

  if(!it.length&&!d.errors.length){box.innerHTML='<span class="muted">Peso médio de entrada: aparece conforme você lança os animais.</span>';return}
  var tot=it.reduce(function(a,i){return a+i.w},0),h='';
  if(it.length) h+='<div class="big">'+n1(tot/it.length)+' kg</div><span class="muted">peso médio de entrada · '+plural(it.length,'animal','animais')+' · '+n0(tot)+' kg no total</span>';

}

function dumpAll(){
  var data={lots:{},events:{},costs:{},fcosts:{},config:{}};
  function put(c,arr){(arr||[]).forEach(function(o){var d=clone(o);delete d.id;data[c][o.id]=d})}
  put('lots',S.lots);put('events',S.events);put('costs',S.costs);put('fcosts',S.fcosts);
  data.config.main=clone(S.cfg||{});data.config.sim=clone(S.sim||{});
  return {app:'caderneta',v:1,at:today(),data:data};
}
async function saveFile(name,text){
  try{
    if(window.claude&&window.claude.use){
      var dl=await window.claude.use('downloads');
      if(dl){await dl.save({filename:name,data:new Blob([text],{type:'application/json'})});return}
    }
  }catch(e){if(e&&e.code==='declined') return}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function exportData(){await saveFile('caderneta-'+today()+'.json',JSON.stringify(dumpAll()));toast('Cópia dos dados pronta')}
function importFile(file){
  var r=new FileReader();
  r.onload=async function(){
    var o;try{o=JSON.parse(r.result);if(!o||o.app!=='caderneta'||!o.data||typeof o.data!=='object') throw new Error('x')}catch(e){toast('Arquivo inválido. Use um arquivo exportado pela Caderneta.');return}
    if(!S.db||!S.canWrite){toast('Não é possível salvar agora.');return}
    var n=0,okk=await write(null,async function(){
      var cols=['lots','events','costs','fcosts'];
      for(var i=0;i<cols.length;i++){var c=o.data[cols[i]]||{};for(var id in c){await S.db.collection(cols[i]).doc(id).set(c[id]);n++}}
      var cf=o.data.config||{};
      if(cf.main) await S.db.doc('config/main').set(cf.main);
      if(cf.sim) await S.db.doc('config/sim').set(cf.sim);
      return true;
    });
    if(okk){toast('Dados importados: '+n+' registros. Nada foi apagado.');popSheet()}
  };
  r.readAsText(file);
}

async function boot(){
  S.view=viewFromHash();render();
  var db=await window.__fbReady,user=null;
  S.db=db;
  if(user){try{if((await user.can('data.write'))===false) S.canWrite=false}catch(e){}}
  if(!db){Object.keys(S.loaded).forEach(function(k){S.loaded[k]=true});render();return}
  var timer=setTimeout(function(){
    if(!Object.keys(S.confirmed).every(function(k){return S.confirmed[k]})){S.slow=true;scheduleRender()}
  },10000);
  function mark(k,snap){
    S.loaded[k]=true;
    if(!snap.metadata.fromCache) S.confirmed[k]=true;
    if(Object.keys(S.confirmed).every(function(x){return S.confirmed[x]})){clearTimeout(timer);S.slow=false}
  }
  function fail(k){return function(e){
    S.loaded[k]=true;S.confirmed[k]=true;
    if(e&&e.code==='revoked') S.revoked=true;
    scheduleRender();
  }}
  db.collection('lots').onSnapshot(function(s){
    S.lots=s.docs.map(toObj).map(function(l){l.animals=l.animals||[];return l});
    S.lots.sort(function(a,b){return ((a.status==='closed')-(b.status==='closed'))||String(b.entry||'').localeCompare(String(a.entry||''))});
    mark('lots',s);scheduleRender();
  },fail('lots'));
  db.collection('events').onSnapshot(function(s){S.events=s.docs.map(toObj);mark('events',s);scheduleRender()},fail('events'));
  db.collection('costs').onSnapshot(function(s){S.costs=s.docs.map(toObj);mark('costs',s);scheduleRender()},fail('costs'));
  db.collection('fcosts').onSnapshot(function(s){S.fcosts=s.docs.map(toObj);mark('fcosts',s);scheduleRender()},fail('fcosts'));
  db.doc('config/main').onSnapshot(function(s){
    S.cfg=Object.assign({},DEFAULT_CFG,s.exists?s.data():{});mark('cfg',s);scheduleRender();
  },fail('cfg'));
  db.doc('config/sim').onSnapshot(function(s){
    S.sim=s.exists?Object.assign({},s.data()):{};mark('sim',s);scheduleRender();
  },fail('sim'));
}

boot();

const app=initializeApp({apiKey:"AIzaSyAEsX_mmCo4sv1yBfot0dW32-ObDESINiA",authDomain:"caderneta-de-engorda.firebaseapp.com",projectId:"caderneta-de-engorda",storageBucket:"caderneta-de-engorda.firebasestorage.app",messagingSenderId:"854163148461",appId:"1:854163148461:web:ca052e84b626ba1f978024"});
const auth=getAuth(app);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
/* Firestore não aceita lista dentro de lista: guardamos as pesagens [data,peso] como {__a:[...]} */
function enc(v){if(Array.isArray(v)) return v.map(function(x){return Array.isArray(x)?{__a:enc(x)}:enc(x)});if(v&&typeof v==='object'){var o={};for(var k in v){if(v[k]!==undefined) o[k]=enc(v[k])}return o}return v}
function dec(v){if(Array.isArray(v)) return v.map(dec);if(v&&typeof v==='object'){if(Object.keys(v).length===1&&Array.isArray(v.__a)) return dec(v.__a);var o={};for(var k in v) o[k]=dec(v[k]);return o}return v}
function fail(e){try{window.dispatchEvent(new CustomEvent('fberror',{detail:{code:e&&e.code}}))}catch(x){}}
/* Offline, a gravação só termina quando o servidor responde. A cópia local já vale na hora, então não esperamos além de 1,5 s. */
function quick(p){p.catch(fail);return Promise.race([p.then(function(){return true}),new Promise(function(r){setTimeout(function(){r(true)},1500)})])}
function docApi(ref){return {id:ref.id,
  set:function(d){return quick(setDoc(ref,enc(d)))},
  update:function(d){return quick(updateDoc(ref,enc(d)))},
  delete:function(){return quick(deleteDoc(ref))},
  onSnapshot:function(cb,er){return onSnapshot(ref,function(s){cb({id:s.id,exists:s.exists(),data:function(){return dec(s.data())},metadata:s.metadata})},er)}}}
const DB={
  collection:function(n){var c=collection(fs,n);return {doc:function(id){return docApi(id?doc(c,id):doc(c))},
    onSnapshot:function(cb,er){return onSnapshot(c,function(s){cb({docs:s.docs.map(function(d){return {id:d.id,data:function(){return dec(d.data())}}}),metadata:s.metadata})},er)}}},
  doc:function(p){return docApi(doc(fs,p))}
};
const box=document.getElementById('login'),form=document.getElementById('login-form'),err=document.getElementById('lg-err');
let started=false;
onAuthStateChanged(auth,function(u){
  if(u){box.classList.remove('on');if(!started){started=true;window.__fbResolve(DB)}}
  else{if(started){location.reload();return}box.classList.add('on')}
});
form.addEventListener('submit',async function(e){
  e.preventDefault();err.textContent='';
  try{await signInWithEmailAndPassword(auth,document.getElementById('lg-mail').value.trim(),document.getElementById('lg-pass').value)}
  catch(x){var c=x&&x.code||'';err.textContent=c==='auth/network-request-failed'?'Sem internet. O primeiro login precisa de sinal.':(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email')?'E-mail ou senha incorretos.':c==='auth/too-many-requests'?'Muitas tentativas. Espere alguns minutos.':'Não foi possível entrar ('+c+').'}
});
window.__fbSignOut=function(){signOut(auth)};
</script>
</body></html>
